name: Build and deploy blog
on:
  push:
    branches: [main]
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.decide.outputs.deploy }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Sync approved posts
        run: node scripts/sync.mjs
      - name: Check for missing news cards
        id: covers
        run: |
          need=false
          [ -f assets/logo.webp ] || need=true
          for f in posts/*.json; do
            s=$(basename "$f" .json)
            [ -f "assets/covers/$s.png" ] || need=true
          done
          echo "need=$need" >> "$GITHUB_OUTPUT"
      - name: Make news cards
        if: steps.covers.outputs.need == 'true'
        run: |
          npm i --no-save --silent playwright@1.56.0
          npx playwright install --with-deps chromium
          node scripts/covers.mjs
      - name: Commit new posts and cards
        id: commit
        run: |
          git config user.name "ug-blog-bot"
          git config user.email "ug-blog-bot@users.noreply.github.com"
          git add posts assets/covers assets/logo.webp 2>/dev/null || git add posts assets/covers
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "New posts and news cards"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Decide deploy
        id: decide
        run: |
          if [ "${{ github.event_name }}" != "schedule" ] || [ "${{ steps.commit.outputs.changed }}" = "true" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Build site
        if: steps.decide.outputs.deploy == 'true'
        run: node build.mjs
      - uses: actions/configure-pages@v5
        if: steps.decide.outputs.deploy == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.decide.outputs.deploy == 'true'
        with:
          path: dist
  deploy:
    needs: build
    if: needs.build.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
